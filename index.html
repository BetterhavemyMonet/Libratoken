<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Libra ⚖️ + Monet Money 💵</title>
<script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
<style>
body {
  background:#0f0f1a;
  color:white;
  font-family:Arial, sans-serif;
  text-align:center;
  padding-top:80px;
}
img { width:140px; margin:10px; }
button {
  padding:12px 25px;
  margin:10px;
  border-radius:8px;
  border:none;
  font-size:16px;
  cursor:pointer;
}
.connect { background:#512da8; color:white; }
.check { background:#00c853; color:white; }
.token-box {
  margin-top:30px;
  padding:15px;
  border-radius:12px;
  background:#1a1a2e;
}
</style>
</head>
<body>

<img src="Monet.png" alt="Libra Logo" />
<img src="Monetmoney.png" alt="Monet Money Logo" />

<h1>Libra ⚖️ + Monet Money 💵</h1>
<p>Connect wallet to view balances.</p>

<button class="connect" onclick="connectWallet()">Connect Wallet</button>
<button class="check" onclick="checkBalances()">Check Balances</button>

<p id="wallet"></p>

<div class="token-box">
  <p id="libraBalance">Libra Balance: --</p>
  <p id="monetBalance">Monet Money Balance: --</p>
</div>

<script>
let walletAddress = null;
let publicKeyObj = null;

const LIBRA_MINT = "BYqHJvvtJSgXQi9iuL6PcXmVNADqBDxNGkyAhY8zwTWR";
const MONET_MINT = "9CHAHvqDhPyiOgg4TKfvJ9iVp7dZaQqVao9uU7W7E5ZD";

const connection = new solanaWeb3.Connection(
  solanaWeb3.clusterApiUrl("mainnet-beta")
);

async function connectWallet() {
  if (window.solana && window.solana.isPhantom) {
    try {
      const resp = await window.solana.connect();
      walletAddress = resp.publicKey.toString();
      publicKeyObj = resp.publicKey;
      document.getElementById("wallet").innerText =
        "Connected: " + walletAddress;
    } catch (err) {
      alert("Connection failed.");
    }
  } else {
    alert("Phantom Wallet not found.");
  }
}

async function getTokenBalance(mint) {
  const accounts = await connection.getParsedTokenAccountsByOwner(
    publicKeyObj,
    { mint: new solanaWeb3.PublicKey(mint) }
  );

  if (accounts.value.length === 0) return 0;

  return accounts.value[0].account.data.parsed.info.tokenAmount.uiAmount;
}

async function checkBalances() {
  if (!publicKeyObj) {
    alert("Connect wallet first.");
    return;
  }

  try {
    const libra = await getTokenBalance(LIBRA_MINT);
    const monet = await getTokenBalance(MONET_MINT);

    document.getElementById("libraBalance").innerText =
      "Libra Balance: " + libra + " ⚖️";

    document.getElementById("monetBalance").innerText =
      "Monet Money Balance: " + monet + " 💵";
  } catch (err) {
    alert("Error fetching balances.");
  }
}
</script>

</body>
</html>
